<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Clara | Painel de Gestão</title>
<link rel="stylesheet" href="painel.css?v=12">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Clara.<small>GERENTE DE OPERAÇÕES</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="who" id="who"></div>
    <div class="sidefoot"><button class="btn light sm" id="b-sair" style="width:100%">↪ Sair</button><p id="emp-foot" style="margin:12px 0 0"></p></div>
  </aside>
  <div class="main">
    <header class="top"><strong id="top-titulo">Clara <span class="muted">/ Painel</span></strong><div class="right"><span id="top-quem"></span><img class="mini" src="clara.jpg" alt="Clara"></div></header>
    <div class="body" id="body"><div class="loading">Carregando o painel…</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="modal"></div>
<div class="v3-print" id="print"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.3/dist/umd/supabase.min.js"></script>
<script>
const CLARA = { url: 'https://tkdzoxuspcbsnhmzxypd.supabase.co', chavePublica: 'sb_publishable_C5QQEoKHTKtCUL7gUAaq8w_Wsqz6en8', servidor: 'https://tkdzoxuspcbsnhmzxypd.supabase.co/functions/v1/clara', conversar: 'https://claude.ai/new' };
const sb = supabase.createClient(CLARA.url, CLARA.chavePublica, { auth: { persistSession: true } });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hojeISO = () => new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const dBR = d => d ? new Date(String(d).length === 10 ? d + 'T12:00:00' : d).toLocaleDateString('pt-BR') : '';
const dtBR = d => d ? new Date(d).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '';
const slug = t => String(t || 'item').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50) + '-' + Math.random().toString(36).slice(2,6);
const concluida = s => ['concluida','concluída','concluido','concluído','feito','feita','finalizada','entregue'].includes(String(s||'').toLowerCase());

let ctx, E, D = {}, aba = 'hoje', subProc = 'mapa';
const ABAS = [
  ['hoje','◫','HOJE','hoje'], ['processos','⇄','PROCESSOS','processos'], ['indicadores','◉','INDICADORES','indicadores'],
  ['rotinas','☑','ROTINAS','rotinas'], ['diario','▤','DIÁRIO DE BORDO','diario'], ['crescimento','↗','CRESCIMENTO','crescimento'],
  ['clara','✧','MINHA CLARA',null], ['config','⚙','CONFIGURAÇÕES','__gestao']
];
const gestao = () => ctx?.eu?.permissoes === 'total';
const aprova = () => ['proprietario','gestor','consultora'].includes(ctx?.eu?.perfil);
const pode = (area, acao = 'ver') => gestao() || (ctx?.eu?.permissoes?.[area]?.ver === true && ctx?.eu?.permissoes?.[area]?.[acao] === true);
const pessoas = () => (ctx?.equipe || []);
const nome = id => pessoas().find(p => p.pessoa_id === id)?.nome || '';
const col = c => (D.registros || []).filter(r => r.colecao === c).map(r => ({ ...r.dados, _rev: r.revisao, _em: r.atualizado_em, _col: r.colecao }));
const toast = (t, ms = 3200) => { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', ms); };

// ───────── gravação: proposta + confirmação (o clique em Salvar é a confirmação) ─────────
async function salvar(alteracoes, sucesso = 'Registrado no painel.') {
  try {
    const { data: p, error: e1 } = await sb.rpc('clara_propor', { p_empresa: E, p_alteracoes: alteracoes });
    if (e1) throw e1;
    const { data: r, error: e2 } = await sb.rpc('clara_confirmar', { p_empresa: E, p_proposta: p.proposta_id, p_hash: p.hash, p_chave: 'painel-' + Date.now() + '-' + Math.random().toString(36).slice(2,8), p_confirmado: true });
    if (e2) throw e2;
    toast(sucesso); fecharModal(); await carregar(); render(); return r;
  } catch (e) { toast(traduz(e), 6000); return null; }
}
const criar = (colecao, dados, motivo) => salvar([{ colecao, acao: 'criar', id: dados.id, revisao_esperada: null, motivo, dados: { fonte: `Painel — ${ctx.eu.pessoa?.nome || ctx.eu.email} em ${dBR(hojeISO())}`, ...dados } }]);
const editar = (reg, novos, motivo) => { const { _rev, _em, _col, ...orig } = reg; return salvar([{ colecao: _col, acao: 'editar', id: reg.id, revisao_esperada: _rev, motivo, dados: { ...orig, ...novos } }]); };
const arquivar = (reg, motivo) => { const { _rev, _em, _col, ...orig } = reg; return salvar([{ colecao: _col, acao: 'excluir', id: reg.id, revisao_esperada: _rev, motivo, dados: orig }], 'Arquivado. O histórico foi preservado.'); };
function traduz(e) {
  const m = String(e?.message || e || '');
  const map = { ACESSO_NEGADO: 'Seu perfil não tem permissão para esta ação.', APROVACAO_RESTRITA: 'Somente a gestão aprova e altera processos publicados no Manual Vivo.', CONFLITO_REVISAO: 'Alguém alterou este item agora há pouco. Recarreguei os dados: tente de novo.', SOMENTE_GESTAO: 'Ação restrita ao proprietário/consultoria.', PESSOA_COM_VINCULOS_ATIVOS: 'Esta pessoa ainda é responsável por itens ativos.', TAREFA_RESTRITA_A_GESTAO: 'Funcionário cria tarefas só para si. Para um colega, avise a gestão pela Clara.', FONTE_OBRIGATORIA: 'Informe a origem da informação.', LIMITE_USUARIOS_PAINEL: 'Todos os usuários do painel previstos no contrato já estão em uso. Desative alguém ou fale com a consultoria para ampliar.', LIMITE_LICENCAS_CLARA: 'Todas as licenças da Clara do contrato já estão em uso. A pessoa pode entrar só no painel, ou fale com a consultoria para ampliar.' };
  for (const k in map) if (m.includes(k)) { if (k === 'CONFLITO_REVISAO') carregar().then(render); return map[k]; }
  return 'Não foi possível concluir: ' + m;
}

// ───────── carregamento ─────────
async function carregar() {
  const q = (t, o = {}) => { let x = sb.from(t).select('*').eq('empresa_id', E); for (const [k, v] of Object.entries(o)) x = x.order(k, { ascending: v }); return x.limit(1000); };
  const [reg, dia, mem, rec] = await Promise.all([ q('clara_registros', { colecao: true, id: true }).eq('arquivado', false), q('clara_diario', { registrado_em: false }), q('clara_memoria', { criado_em: false }), q('clara_recados', { criado_em: false }) ]);
  D = { registros: reg.data || [], diario: dia.data || [], memoria: mem.data || [], recados: rec.data || [] };
  if (aprova()) { const { data } = await sb.rpc('clara_dependencia', { p_empresa: E }); D.dep = data; }
  { const { data } = await sb.rpc('clara_execucoes', { p_empresa: E }); D.exec = data || {}; }
  if (gestao()) { const { data } = await sb.rpc('clara_equipe_listar', { p_empresa: E }); D.acessos = data; }
}

// ───────── componentes ─────────
const tagStatusDoc = s => s === 'publicado' ? '<span class="tag ok">Manual Vivo</span>' : s === 'validacao' ? '<span class="tag warn">Aguardando aprovação</span>' : '<span class="tag gray">Descoberta</span>';
const tagFaixa = f => ({ baixa: '<span class="tag ok">Dependência baixa</span>', moderada: '<span class="tag blue">Dependência moderada</span>', alta: '<span class="tag warn">Dependência alta</span>', critica: '<span class="tag red">Dependência crítica</span>' }[f] || '<span class="tag gray">Não mensurado</span>');
const tagPrazo = (p, st) => { if (!p) return ''; if (concluida(st)) return `<span class="tag ok">${dBR(p)}</span>`; const h = hojeISO(); return p < h ? `<span class="tag red">Venceu ${dBR(p)}</span>` : p === h ? `<span class="tag warn">Hoje</span>` : `<span class="tag">${dBR(p)}</span>`; };
const vazio = t => `<div class="empty">${t}</div>`;
const cab = (eyebrow, titulo, sub, acoes = '') => `<div class="flex" style="align-items:flex-start"><div><div class="eyebrow">${eyebrow}</div><h1>${titulo}</h1><p class="sub">${sub}</p></div><div class="flexwrap">${acoes}</div></div>`;
const optsPessoas = sel => `<option value="">—</option>` + pessoas().map(p => `<option value="${esc(p.pessoa_id)}" ${p.pessoa_id === sel ? 'selected' : ''}>${esc(p.nome)}${p.funcao ? ' · ' + esc(p.funcao) : ''}</option>`).join('');
function depRing(nota, faixa) {
  const cor = { baixa: '#14a07e', moderada: '#2388a9', alta: '#d78a32', critica: '#c4472b' }[faixa] || '#9fb2c2';
  const pct = nota == null ? 0 : nota;
  return `<div class="dep-ring" style="background:conic-gradient(${cor} 0 ${pct}%,#e9f0f5 ${pct}% 100%)"><div><strong>${nota ?? '—'}</strong><small>de 100</small></div></div>`;
}

// ───────── modal genérico ─────────
function abrirModal(html) { $('modal').innerHTML = `<div class="v3-modalbg" onclick="if(event.target===this)fecharModal()"><div class="v3-modal">${html}</div></div>`; }
function fecharModal() { $('modal').innerHTML = ''; }
const campo = (id, rot, val = '', tipo = 'text', extra = '') => tipo === 'textarea'
  ? `<label>${rot}<textarea class="v3-input" id="${id}" ${extra}>${esc(val)}</textarea></label>`
  : `<label>${rot}<input class="v3-input" id="${id}" type="${tipo}" value="${esc(val)}" ${extra}></label>`;
const sel = (id, rot, html) => `<label>${rot}<select class="v3-input" id="${id}">${html}</select></label>`;
const val = id => ($(id)?.value ?? '').trim();
const linhas = id => val(id).split('\n').map(s => s.trim()).filter(Boolean);

// ───────── HOJE ─────────
function vHoje() { return gestao() ? vHojeDono() : aprova() ? vHojeGestor() : vHojeEquipe(); }

const saudacaoHora = () => { const h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; };
const dataLonga = () => new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
const saudar = sub => `<div class="ch-saud"><h1>${saudacaoHora()}, ${esc((ctx.eu.pessoa?.nome || ctx.eu.email || '').split(' ')[0])}.</h1><p>${esc(dataLonga())}${sub ? ' · ' + esc(sub) : ''}</p></div>`;
const secao = (titulo, dir = '') => `<div class="ch-secao"><h3>${titulo}</h3><span>${dir}</span></div>`;
const minhasAbertas = () => col('tarefas').filter(t => !concluida(t.status) && t.responsavel_pessoa_id === ctx.eu.pessoa_id);
const recadosMeus = () => D.recados.filter(r => r.para_pessoa_id === ctx.eu.pessoa_id && ['aberto','visto'].includes(r.status));
const publicados = () => col('processos').filter(p => p.status_doc === 'publicado');
const meusProcessos = () => { const m = publicados().filter(p => p.responsavel_pessoa_id === ctx.eu.pessoa_id || p.substituto_pessoa_id === ctx.eu.pessoa_id); return m.length ? m : publicados(); };
const semSubstituto = () => col('processos').filter(p => !p.substituto_pessoa_id && !p.substituto);
const aguardandoAprovacao = () => col('processos').filter(p => p.status_doc === 'validacao');
const impedidas = () => col('tarefas').filter(t => t.status === 'impedida');

// ───────── HOJE · quem executa (celular primeiro) ─────────
function vHojeEquipe() {
  const tarefas = minhasAbertas(), recs = recadosMeus(), procs = meusProcessos();
  const meusInd = col('indicadores').filter(i => i.responsavel_pessoa_id === ctx.eu.pessoa_id);
  return `<div class="ch-col">
    ${saudar(ctx.eu.pessoa?.funcao || '')}
    ${secao('Seu dia', tarefas.length ? (tarefas.length === 1 ? '1 aberta' : tarefas.length + ' abertas') : 'tudo em dia')}
    ${tarefas.length ? tarefas.map(cardTarefaEquipe).join('') : `<div class="ch-card ch-vazio">Nada no seu nome agora. Se travar em alguma coisa, avise a gestão pela Clara ou pelo processo abaixo.</div>`}
    ${recs.length ? secao('Recados') + recs.map(cardRecadoEquipe).join('') : ''}
    ${secao('Como se faz', procs.length ? procs.length + (procs.length === 1 ? ' processo' : ' processos') : '')}
    ${procs.length ? procs.map(accProcesso).join('') : `<div class="ch-card ch-vazio">Nenhum processo publicado ainda. Assim que a gestão publicar no Manual Vivo, o passo a passo aparece aqui.</div>`}
    ${meusInd.length ? secao('Para lançar') + meusInd.map(cardMedicao).join('') : ''}
  </div>`;
}

function cardTarefaEquipe(t) {
  const h = hojeISO();
  const chip = !t.prazo ? '' : t.prazo < h ? `<span class="tag red">Venceu ${dBR(t.prazo)}</span>` : t.prazo === h ? '<span class="tag warn">Hoje</span>' : `<span class="tag">${dBR(t.prazo)}</span>`;
  const proc = t.processo_id ? col('processos').find(p => p.id === t.processo_id) : null;
  return `<article class="ch-card ch-alvo">
    <h4>${esc(t.titulo || t.nome)}</h4>
    ${proc ? `<p class="ch-de">Do processo ${esc(proc.nome)}</p>` : ''}
    <div class="ch-linha">${chip}${t.descricao ? `<span class="tag">Pronto quando: ${esc(t.descricao)}</span>` : ''}</div>
    <div class="ch-acoes"><button class="ch-btn" onclick="concluirRapido('${esc(t.id)}')">Concluí</button><button class="ch-btn sec" onclick="travarTarefa('${esc(t.id)}')">Travei</button></div>
  </article>`;
}

function cardRecadoEquipe(r) {
  return `<article class="ch-card">
    <h4>${esc(r.assunto)}</h4>
    <p class="ch-de">${esc(r.de || 'Da gestão')}${r.prioridade === 'alta' || r.prioridade === 'urgente' ? ' · prioridade alta' : ''}</p>
    ${r.mensagem ? `<p class="ch-msg">${esc(r.mensagem)}</p>` : ''}
    <div class="ch-acoes"><button class="ch-btn sec" onclick="recadoStatus('${r.id}','concluido')">Entendi</button></div>
  </article>`;
}

function cardMedicao(i) {
  return `<article class="ch-card">
    <h4>${esc(i.nome)}</h4>
    <p class="ch-de">${esc(i.unidade || '')}${i.meta ? ' · meta ' + esc(String(i.meta)) : ''}</p>
    <div class="ch-acoes"><button class="ch-btn sec" onclick="formMedicao('${esc(i.id)}')">Lançar medição</button></div>
  </article>`;
}

async function concluirRapido(id) {
  const t = col('tarefas').find(x => x.id === id); if (!t) return;
  await editar(t, { status: 'concluida', concluida_em: new Date().toISOString() }, 'Concluída pelo painel');
}

function travarTarefa(id) {
  const t = col('tarefas').find(x => x.id === id);
  abrirModal(`<h2>O que está impedindo?</h2><p class="v3-muted">${esc(t.titulo || '')}</p>
    ${campo('f-imp', 'Escreva em uma linha', '', 'textarea')}
    <p class="v3-muted">A tarefa fica em aberto, marcada como impedida, e a gestão vê isso na tela dela.</p>
    <div class="acts"><button class="v3-btn alt" onclick="fecharModal()">Cancelar</button><button class="v3-btn" onclick="salvarTrava('${esc(id)}')">Registrar impedimento</button></div>`);
}

async function salvarTrava(id) {
  const motivo = val('f-imp'); if (!motivo) return toast('Escreva o que está impedindo.');
  const t = col('tarefas').find(x => x.id === id);
  const r = await editar(t, { status: 'impedida', impedimento: motivo, impedida_em: new Date().toISOString() }, 'Impedimento registrado pelo painel');
  if (!r) return;
  const proc = t.processo_id ? col('processos').find(p => p.id === t.processo_id) : null;
  const destino = proc && proc.responsavel_pessoa_id && proc.responsavel_pessoa_id !== ctx.eu.pessoa_id ? proc.responsavel_pessoa_id : null;
  if (destino) {
    const { error } = await sb.rpc('clara_recado_enviar', { p_empresa: E, p_para_pessoa_id: destino, p_tipo: 'alerta', p_assunto: 'Impedimento em: ' + (t.titulo || ''), p_mensagem: motivo, p_prioridade: 'alta', p_prazo: null, p_chave: 'imp-' + id + '-' + Date.now() });
    if (!error) toast(nome(destino) + ' foi avisado.');
  }
}

// ───────── Manual Vivo em modo execução ─────────
function accProcesso(p) {
  const etapas = Array.isArray(p.etapas) ? p.etapas : [];
  const info = (D.exec || {})[p.id] || {};
  const ab = info.minha_aberta || null;
  const marcados = ab && ab.passos ? ab.passos : {};
  const feitos = Object.values(marcados).filter(Boolean).length;
  const total = etapas.length;
  const pct = total ? Math.round(feitos / total * 100) : 0;
  const excecoes = [].concat(p.excecoes || p.excecao || []).filter(Boolean);
  const pessoas = info.pessoas || 0;
  return `<details class="ch-proc" data-proc="${esc(p.id)}">
    <summary>
      <span class="ch-pid">${esc((p.id || '').replace(/^proc-/, '').split('-')[0].toUpperCase())}</span>
      <span class="ch-ptit"><b>${esc(p.nome)}</b><small>${total} ${total === 1 ? 'passo' : 'passos'}${pessoas > 1 ? ' · ' + pessoas + ' pessoas já executaram' : ''}</small></span>
      <span class="ch-chev" aria-hidden="true"></span>
    </summary>
    <div class="ch-pcorpo">
      <div class="ch-pmeta">${p.responsavel_pessoa_id ? `<span class="tag">Responsável: ${esc(nome(p.responsavel_pessoa_id))}</span>` : ''}${p.substituto_pessoa_id || p.substituto ? `<span class="tag">Substituto: ${esc(nome(p.substituto_pessoa_id) || p.substituto)}</span>` : '<span class="tag warn">Sem substituto</span>'}</div>
      ${total ? `<ul class="ch-passos">${etapas.map((e, idx) => `<li><label class="ch-passo"><input type="checkbox" ${marcados[idx] ? 'checked' : ''} onchange="marcarPasso('${esc(p.id)}',${idx},this.checked,${total},this)"><span class="ch-txt">${esc(typeof e === 'string' ? e : (e.titulo || e.etapa || ''))}</span></label></li>`).join('')}</ul>` : `<div class="ch-vazio">Este processo ainda não tem o passo a passo escrito.</div>`}
      ${excecoes.map(x => `<div class="ch-exc"><b>Se sair do normal</b>${esc(typeof x === 'string' ? x : JSON.stringify(x))}</div>`).join('')}
      ${p.decisao_proprietaria ? `<div class="ch-exc"><b>Quem decide</b>${esc(p.decisao_proprietaria)}</div>` : ''}
      <div class="ch-barra"><span style="width:${pct}%"></span></div>
      <p class="ch-prog ex-txt">${feitos ? `${feitos} de ${total} passos · ${pct}%` : 'Nenhum passo concluído'}</p>
      <div class="ch-acoes" style="flex-wrap:wrap">
        <button class="ch-btn ex-fim" ${total && feitos === total ? '' : 'disabled'} onclick="concluirExecucao('${esc(p.id)}')">Concluir execução</button>
        <button class="ch-btn sec" onclick="sugerirMelhoria('${esc(p.id)}')">Sugerir melhoria</button>
      </div>
    </div>
  </details>`;
}

async function marcarPasso(proc, idx, feito, total, el) {
  let ex = ((D.exec || {})[proc] || {}).minha_aberta;
  if (!ex) {
    const { data, error } = await sb.rpc('clara_execucao_abrir', { p_empresa: E, p_processo: proc, p_total: total });
    if (error) { el.checked = !feito; return toast(traduz(error)); }
    ex = data; D.exec = D.exec || {}; D.exec[proc] = { ...(D.exec[proc] || {}), minha_aberta: ex };
  }
  const { data, error } = await sb.rpc('clara_execucao_passo', { p_empresa: E, p_execucao: ex.id, p_indice: idx, p_feito: feito });
  if (error) { el.checked = !feito; return toast(traduz(error)); }
  D.exec[proc].minha_aberta = data;
  pintarProgresso(proc, data.concluidos, total);
}

function pintarProgresso(proc, feitos, total) {
  const el = document.querySelector(`[data-proc="${proc}"]`); if (!el) return;
  const pct = total ? Math.round(feitos / total * 100) : 0;
  el.querySelector('.ch-barra span').style.width = pct + '%';
  el.querySelector('.ex-txt').textContent = feitos ? `${feitos} de ${total} passos · ${pct}%` : 'Nenhum passo concluído';
  el.querySelector('.ex-fim').disabled = !(total && feitos === total);
}

async function concluirExecucao(proc) {
  const ex = ((D.exec || {})[proc] || {}).minha_aberta;
  if (!ex) return toast('Marque os passos antes de concluir.');
  const { error } = await sb.rpc('clara_execucao_concluir', { p_empresa: E, p_execucao: ex.id, p_observacao: null });
  if (error) return toast(traduz(error));
  toast('Execução registrada. A gestão vê no Diário de Bordo.');
  await carregar(); render();
}

function sugerirMelhoria(proc) {
  const p = col('processos').find(x => x.id === proc);
  abrirModal(`<h2>Sugerir melhoria</h2><p class="v3-muted">${esc(p.nome)}</p>
    ${campo('f-sug', 'O que você mudaria, e por quê', '', 'textarea')}
    <p class="v3-muted">Sua sugestão vai para a gestão como oportunidade de melhoria. O processo publicado não muda até alguém aprovar.</p>
    <div class="acts"><button class="v3-btn alt" onclick="fecharModal()">Cancelar</button><button class="v3-btn" onclick="salvarSugestao('${esc(proc)}')">Enviar</button></div>`);
}

function salvarSugestao(proc) {
  const txt = val('f-sug'); if (!txt) return toast('Escreva a sua sugestão.');
  const p = col('processos').find(x => x.id === proc);

  return cab(`CLARA / ${esc(ctx.empresa.nome.toUpperCase())}`, 'Configurações', 'Gerencie os dados da empresa, usuários e acessos.') + licencas + `
  <div class="grid two"><div class="panel"><h2>Empresa</h2>${campo('e-nome','Nome', ctx.empresa.nome)}${campo('e-seg','Segmento', c.publico?.segmento || c.segmento || '')}${campo('e-loc','Localização', c.publico?.localizacao || c.localizacao || '')}<button class="btn" onclick="salvarEmpresa()">Salvar empresa</button></div>
  <div class="panel"><h2>Permissões</h2><p class="hint">Cada pessoa vê e edita somente o que o perfil permite. O servidor aplica as regras: o painel e a Clara seguem as mesmas permissões.</p><div class="stack"><div class="item"><b>Proprietária</b><p>Vê e aprova tudo, gerencia a equipe.</p></div><div class="item"><b>Gestor</b><p>Coordena processos, rotinas, indicadores e crescimento; aprova processos.</p></div><div class="item"><b>Funcionário</b><p>Executa e atualiza tarefas e rotinas; sugere processos (a gestão aprova).</p></div></div></div></div>
  <div class="panel" style="margin-top:16px"><div class="flex"><h2>Usuários e equipe</h2><button class="btn" onclick="formConvite()">+ Dar acesso</button></div>
   <div class="tablewrap"><table><tr><th>Pessoa</th><th>E-mail</th><th>Perfil</th><th>Situação</th><th>Clara no Claude</th><th></th></tr>${(a.acessos || []).map(x => `<tr><td><b>${esc(x.nome || '—')}</b></td><td>${esc(x.email)}</td><td>${esc(x.perfil)}</td><td>${x.ativo ? '<span class="tag ok">ativo</span>' : '<span class="tag gray">desativado</span>'}</td><td>${x.ativo ? `<label class="v3-muted" style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" ${x.acesso_clara ? 'checked' : ''} ${x.usuario_id === ctx.eu.usuario_id ? 'disabled title="Sua própria licença é ajustada pela consultoria"' : ''} onchange="alternarClara('${x.usuario_id}',this.checked,this)"> ${x.acesso_clara ? 'com licença' : 'só painel'}</label>` : '—'}</td><td>${x.usuario_id !== ctx.eu.usuario_id && x.perfil !== 'proprietario' ? `<button class="btn light sm" onclick="alternarAcesso('${x.usuario_id}',${!x.ativo})">${x.ativo ? 'Desativar' : 'Reativar'}</button>` : ''}</td></tr>`).join('')}</table></div>
   ${(a.convites_pendentes || []).length ? `<h3 style="margin-top:18px">Convites pendentes</h3>${a.convites_pendentes.map(x => `<p class="v3-muted">${esc(x.email)} · ${esc(x.perfil)} · ${esc(nome(x.pessoa_id))} · ${x.acesso_clara ? 'com Clara' : 'só painel'} — <a href="#" onclick="formConvite('${esc(x.pessoa_id || '')}','${esc(x.email)}','${esc(x.perfil)}');return false">gerar novo link</a></p>`).join('')}` : ''}
   ${(a.pessoas_sem_acesso || []).length ? `<h3 style="margin-top:18px">Pessoas do mapeamento ainda sem acesso</h3><div class="flexwrap">${a.pessoas_sem_acesso.map(x => `<button class="btn light sm" onclick="formConvite('${esc(x.pessoa_id)}')">${esc(x.nome)} · dar acesso</button>`).join('')}</div>` : ''}</div>`;
}
async function salvarEmpresa() {
  const { error } = await sb.rpc('clara_empresa_atualizar', { p_empresa: E, p_nome: val('e-nome'), p_contexto: { publico: { ...(ctx.contexto?.publico || {}), segmento: val('e-seg') || null, localizacao: val('e-loc') || null } } });
  if (error) return toast(traduz(error)); toast('Dados da empresa salvos.'); await iniciar(E);
}
async function alternarClara(u, ligar, el) {
  const { error } = await sb.rpc('clara_acesso_clara', { p_empresa: E, p_usuario: u, p_ativo: ligar });
  if (error) { if (el) el.checked = !ligar; return toast(traduz(error), 6000); }
  toast(ligar ? 'Licença da Clara atribuída.' : 'Licença da Clara retirada. A pessoa continua usando o painel.'); await carregar(); render();
}
async function salvarLicencas() {
  const n = id => { const v = val(id); return v === '' || v == null ? null : Math.max(0, parseInt(v, 10)); };
  const { error } = await sb.rpc('clara_licenca_definir', { p_empresa: E, p_licencas_clara: n('lic-clara'), p_licencas_painel: n('lic-painel') });
  if (error) return toast(traduz(error)); toast('Contrato de licenças salvo.'); await carregar(); render();
}
async function alternarAcesso(u, ativo) {
  if (!ativo && !confirmar('Desativar este acesso? A pessoa deixa de ver a empresa imediatamente.')) return;
  const { error } = await sb.rpc('clara_acesso_atualizar', { p_empresa: E, p_usuario: u, p_perfil: null, p_permissoes: null, p_ativo: ativo, p_expira_em: null });
  if (error) return toast(traduz(error)); toast(ativo ? 'Acesso reativado.' : 'Acesso desativado.'); await carregar(); render();
}
function formConvite(pessoa = '', email = '', perfil = 'funcionario') {
  const L = (D.acessos || {}).licencas || {}; const livre = L.clara_limite == null || L.clara_em_uso < L.clara_limite;
  abrirModal(`<h2>Dar acesso</h2><p class="v3-muted">Gero um link pessoal para você enviar (por exemplo, pelo WhatsApp). Pelo link, a pessoa cria a senha e entra com o acesso certo.</p>
   ${sel('cv-pessoa','Pessoa do mapeamento', optsPessoas(pessoa))}${campo('cv-email','E-mail da pessoa', email, 'email')}
   ${sel('cv-perfil','Perfil', [['funcionario','Funcionário'],['gestor','Gestor'],['temporario','Temporário']].concat(ctx.eu.perfil === 'consultora' ? [['proprietario','Proprietário']] : []).map(([k,n]) => `<option value="${k}" ${perfil === k ? 'selected' : ''}>${n}</option>`).join(''))}
   <label style="display:flex;gap:8px;align-items:flex-start;margin:6px 0 4px;font-weight:600;font-size:13px"><input type="checkbox" id="cv-clara" ${livre ? '' : 'disabled'}> <span>Incluir a Clara no Claude (licença)<br><small class="v3-muted" style="font-weight:400">${livre ? 'Sem marcar, a pessoa usa só o painel com a equipe.' : 'Todas as licenças da Clara estão em uso: a pessoa entra só no painel.'} Licenças da Clara: ${L.clara_em_uso ?? 0}${L.clara_limite != null ? ' de ' + L.clara_limite : ''}.</small></span></label>
   <div id="cv-res"></div><div class="acts"><button class="v3-btn alt" onclick="fecharModal()">Fechar</button><button class="v3-btn" id="cv-btn" onclick="convidar()">Gerar link de acesso</button></div>`);
}
async function convidar() {
  if (!val('cv-email')) return toast('Informe o e-mail.');
  $('cv-btn').disabled = true;
  try {
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch(CLARA.servidor + '/acao/convidar', { method: 'POST', headers: { authorization: 'Bearer ' + session.access_token, 'content-type': 'application/json' }, body: JSON.stringify({ empresa_id: E, email: val('cv-email'), perfil: val('cv-perfil'), pessoa_id: val('cv-pessoa') || null, acesso_clara: !!($('cv-clara') && $('cv-clara').checked) }) });
    const j = await r.json(); if (!j.ok) throw Error(j.erro);
    const pn = nome(val('cv-pessoa')) || 'tudo bem';
    const msg = j.acesso_clara ? `Olá, ${pn}! Você agora tem acesso à Clara, a gerente de operações da ${ctx.empresa.nome}, e ao painel da equipe. Crie sua senha por este link: ${j.link_convite}` : `Olá, ${pn}! Você agora tem acesso ao painel de operações da ${ctx.empresa.nome}. Crie sua senha por este link: ${j.link_convite}`;
    $('cv-res').innerHTML = j.link_convite ? `<div class="notice" style="margin-top:8px"><b>Link pronto.</b> ${esc(j.orientacao || '')}<div class="linkbox" style="margin-top:8px">${esc(j.link_convite)}</div><div class="row-actions" style="margin-top:8px"><button class="btn light sm" onclick="navigator.clipboard.writeText(${JSON.stringify(j.link_convite).replace(/"/g,'&quot;')});toast('Link copiado.')">Copiar link</button><a class="btn sm" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}">Enviar pelo WhatsApp</a></div></div>` : `<div class="notice">${esc(j.orientacao || 'Acesso vinculado.')}</div>`;
    await carregar();
  } catch (e) { toast(traduz(e), 6000); } finally { const b = $('cv-btn'); if (b) b.disabled = false; }
}

// ───────── estrutura ─────────
const VIEWS = { hoje: vHoje, processos: vProcessos, indicadores: vIndicadores, rotinas: vRotinas, diario: vDiario, crescimento: vCrescimento, clara: vClara, config: vConfig };
function visivel([k,, , area]) {
  // Quem executa vive em três abas: o dia, como se faz e o próprio acesso.
  if (!aprova() && ['indicadores','rotinas','diario','crescimento'].includes(k)) return false;
  if (area === '__gestao') return gestao(); if (area === null) return true; return pode(area);
}
function irPara(k) { aba = k; try { localStorage.setItem('clara-aba', k); } catch {} render(); window.scrollTo(0,0); }
function render() {
  const abas = ABAS.filter(visivel); if (!abas.some(a => a[0] === aba)) aba = abas[0][0];
  $('nav').innerHTML = abas.map(([k, ic, n]) => `<button class="${k === aba ? 'active' : ''}" onclick="irPara('${k}')">${ic}&nbsp;&nbsp; ${k === 'processos' && !aprova() ? 'COMO SE FAZ' : n}</button>`).join('');
  $('body').innerHTML = VIEWS[aba]();
}
async function iniciar(empresaId) {
  const { data, error } = await sb.rpc('clara_contexto', empresaId ? { p_empresa: empresaId } : {});
  if (error) { $('body').innerHTML = `<div class="empty">Não foi possível abrir o painel: ${esc(error.message)}</div>`; return; }
  if (data.escolher_empresa) {
    if (!data.empresas.length) { $('body').innerHTML = '<div class="empty">Seu login ainda não está vinculado a nenhuma empresa. Fale com quem enviou o seu acesso.</div>'; return; }
    let s; try { s = localStorage.getItem('clara-empresa'); } catch {}
    return iniciar(data.empresas.find(e => e.empresa_id === s)?.empresa_id || data.empresas[0].empresa_id);
  }
  ctx = data; E = data.empresa.id;
  $('top-titulo').innerHTML = `${esc(ctx.empresa.nome)} <span class="muted">/ Painel de Gestão</span>`;
  $('top-quem').textContent = `${ctx.eu.pessoa?.nome || ctx.eu.email} · ${ctx.eu.perfil}`;
  const outras = ctx.outras_empresas || [];
  $('who').innerHTML = `<b>${esc(ctx.eu.pessoa?.nome || ctx.eu.email)}</b>${esc(ctx.eu.perfil)}${outras.length > 1 ? `<select onchange="try{localStorage.setItem('clara-empresa',this.value)}catch{};iniciar(this.value)">${outras.map(e => `<option value="${esc(e.empresa_id)}" ${e.empresa_id === E ? 'selected' : ''}>${esc(e.nome)}</option>`).join('')}</select>` : ''}`;
  $('emp-foot').textContent = ctx.empresa.nome;
  $('body').innerHTML = '<div class="loading">Carregando…</div>';
  await carregar(); render();
}
$('b-sair').onclick = async () => { await sb.auth.signOut(); location.href = 'acesso.html'; };
(async () => {
  try { aba = localStorage.getItem('clara-aba') || 'hoje'; } catch {}
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = 'acesso.html?voltar=painel'; return; }
  iniciar();
})();
</script>
</body>
</html>
