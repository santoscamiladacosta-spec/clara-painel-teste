])} · Período: ${esc(i.periodo_referencia||'não informado')} · Fonte: ${esc(i.fonte_dados||'não informada')}<br>${esc(i.observacoes||'')}<br>Histórico de medições: não disponível.</div></td></tr>`:''}`).join('')}</tbody></table></div>`)}`}

function oppPilot(o,running){
 const actions=SCENARIO.actions[o.id]||['Avaliar a oportunidade com a equipe','Definir o primeiro teste e o responsável','Medir resultados e decidir próximos passos'];
 const done=pilot.oppDone[o.id]||[false,false,false];
 const meta=pilot.actionMeta||{};
 const progress=done.filter(Boolean).length;
 return `<div class="item" id="growth-${esc(o.id)}"><div class="flex"><strong>${esc(o.titulo)}</strong>${tag(running?'Em andamento':'Na lista',running?'ok':'blue')}</div><p>${esc(o.descricao||'Oportunidade sugerida pela equipe')}</p><p class="hint">Origem: ${esc(o.fonte||'Diagnóstico Clara')} · ${progress}/3 ações concluídas</p><div class="progress"><span style="width:${progress/3*100}%"></span></div><button class="btn light" onclick="expand('${o.id}')">${expanded===o.id?'Recolher':'Ver as 3 ações'} ↓</button> ${canDecide()?`<button class="btn" onclick="setRunning('${o.id}',${!running})">${running?'Voltar à lista':'Tornar prioridade'}</button>`:''}
 ${expanded===o.id?`<div class="detail"><b>Plano de 3 ações</b><ol class="actions">${actions.map((a,i)=>{
 const m=meta[o.id+'::'+i]||{};
 return `<li style="margin-bottom:13px"><label><input type="checkbox" ${done[i]?'checked':''} ${running?'':'disabled'} onchange="checkOpp('${o.id}',${i})"> ${esc(a)}</label><div class="hint" style="margin:4px 0 6px 20px">Responsável: ${esc(m.responsavel||'A definir')} · Prazo: ${m.prazo?esc(m.prazo.split('-').reverse().join('/')):'A definir'}${m.observacao?' · '+esc(m.observacao):''}</div>${canDecide()?`<button class="btn light" style="margin-left:20px" onclick="editGrowthAction('${o.id}',${i})">✎ Editar ação</button>`:''}</li>`}).join('')}</ol>${done.every(Boolean)&&running?'<p><b>3/3 ações feitas · aguardando validação do resultado</b></p>':''}</div>`:''}</div>`;
}
function focusCards(){
 const focus=[['opo-delegacao','Delegar decisões operacionais'],['opo-padronizacao','Padronizar passagem para orçamento'],['opo-documentacao','Acompanhar qualidade da execução']];
 return focus.map(([id,fallback])=>{
  const o=E.oportunidades.find(x=>x.id===id)||pilot.suggestions.find(x=>x.id===id);
  const done=(pilot.oppDone[id]||[]).filter(Boolean).length;
  const total=(SCENARIO.actions[id]||[]).length||3;
  const status=pilot.running[id]?'Em andamento':'Próxima oportunidade';
  return `<button class="item click" style="display:block;width:100%;text-align:left;background:transparent;cursor:pointer;font:inherit;color:inherit" onclick="openFocus('${id}')"><strong>${esc(o?.titulo||fallback)}</strong><p>${status} · ${done}/${total} ações concluídas. <span style="color:#245e89">Abrir plano →</span></p></button>`;
 }).join('');
}

function editGrowthAction(id,index){

function userForm(id){let u=V3.users.find(x=>x.id===id)||{name:'',email:'',role:'Colaborador',active:true,permissions:{}};showModal(`<h2>${id?'Editar usuário':'Adicionar usuário'}</h2><form onsubmit="saveUser(event,'${safeId(id||'new')}')"><label>Nome *<input class="v3-input" name="name" value="${esc(u.name)}" required></label><label>E-mail de acesso<input class="v3-input" type="email" name="email" value="${esc(u.email||'')}" placeholder="usuario@empresa.com.br"></label><label>Perfil<select class="v3-input" name="role">${['Proprietária','Gestor','Colaborador'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></label><label><input type="checkbox" name="active" ${u.active?'checked':''}> Usuário ativo</label><p class="v3-muted">O login e o envio de convites dependem da futura autenticação online.</p><button class="v3-btn">Salvar usuário</button></form>`)}

function permissionsForm(id){let u=V3.users.find(x=>x.id===id);if(!u)return;let actions=['Visualizar','Cadastrar','Editar','Aprovar','Excluir','Exportar'];showModal(`<h2>Permissões · ${esc(u.name)}</h2><p class="v3-muted">Configuração local para avaliação. Controle de acesso real requer autenticação e políticas no servidor.</p><form onsubmit="savePermissions(event,'${safeId(id)}')"><div class="tablewrap"><table><thead><tr><th>Área</th>${actions.map(a=>`<th>${a}</th>`).join('')}</tr></thead><tbody>${pages.filter(p=>p!=='HOJE').map(p=>`<tr><td>${esc(p)}</td>${actions.map(a=>`<td><input type="checkbox" name="${p}::${a}" ${(u.permissions||{})[p+'::'+a]?'checked':''}></td>`).join('')}</tr>`).join('')}</tbody></table></div><button class="v3-btn">Salvar permissões</button></form>`)}

function v3Settings(){return title('Configurações','Gerencie os dados da empresa, usuários e acessos.')+`<div class="grid two"><div class="v3-card"><h2>Empresa</h2><form onsubmit="saveCompany(event)"><label>Nome<input class="v3-input" name="name" value="${esc(V3.company.name||D.empresa.nome)}" required></label><label>Segmento<input class="v3-input" name="segment" value="${esc(V3.company.segment||D.empresa.segmento)}"></label><label>Localização<input class="v3-input" name="city" value="${esc(V3.company.city||D.empresa.localizacao_geral)}"></label><button class="v3-btn alt">Salvar empresa</button></form></div><div class="v3-card"><h2>Permissões</h2><p>Defina os acessos da equipe conforme as responsabilidades de cada pessoa.</p><span class="v3-chip">Proprietária · Gestor · Colaborador</span></div></div><div class="v3-card"><h2>Usuários e equipe</h2><p class="v3-muted">Adicione, edite, desative, reative ou exclua acessos da empresa.</p><div id="clara-team-mount"><p class="v3-muted">Carregando equipe...</p></div></div>`}

function claraReviewProposal(id){const p=(V3.propostasProcessos||[]).find(x=>x.id===id);if(!p)return;showModal(`<h2>Revisar proposta</h2><h3>${esc(p.titulo)}</h3><p>${esc(p.descricao||'')}</p><div class="v3-toolbar"><button class="v3-btn" onclick="claraDecideProposal('${safeId(id)}','aprovada')">Aprovar</button><button class="v3-btn alt" onclick="claraDecideProposal('${safeId(id)}','ajustes')">Solicitar ajustes</button><button class="v3-btn alt" onclick="claraDecideProposal('${safeId(id)}','rejeitada')">Rejeitar</button></div>`)}
function claraDecideProposal(id,status){if(!['proprietario','gestor'].includes(CLARA_ACCESS?.perfil)){toast('Aprovação restrita a proprietário ou gestor.');return}const p=(V3.propostasProcessos||[]).find(x=>x.id===id);if(!p)return;p.status=status;p.decidido_em=new Date().toISOString();persistV3();closeModal();render()}
function claraLateTasks(){let d=dateISO(new Date());return V3.claraTasks.filter(t=>!t.ok&&t.data<d)}
function claraAddTask(){showModal(`<h2>Novo compromisso</h2><form onsubmit="claraSaveTask(event)"><label>Título<input class="v3-input" name="titulo" required maxlength="180"></label><label>Data<input class="v3-input" name="data" type="date" required></label><label>Responsável<input class="v3-input" name="responsavel" maxlength="120"></label><label>Informações iniciais<textarea class="v3-input" name="informacoes" maxlength="3000" rows="3"></textarea></label><button class="v3-btn">Salvar compromisso</button></form>`)}
function claraSaveTask(e){e.preventDefault();const f=new FormData(e.target);V3.claraTasks.push({id:'t'+Date.now(),titulo:String(f.get('titulo')),data:String(f.get('data')),responsavel:String(f.get('responsavel')||''),ok:false,historico:[{em:new Date().toISOString(),tipo:'criacao',texto:String(f.get('informacoes')||'Compromisso criado.'),autor:CLARA_ACCESS?.perfil||'Usuário'}]});persistV3();closeModal();render()}
function claraToggleTask(id,ok){const t=V3.claraTasks.find(t=>t.id===id);if(t){t.ok=ok;(t.historico||(t.historico=[])).push({em:new Date().toISOString(),tipo:'status',texto:ok?'Marcado como concluído':'Reaberto',autor:CLARA_ACCESS?.perfil||'Usuário'});persistV3();render()}}
function claraEditTask(id){const t=V3.claraTasks.find(x=>x.id===id);if(!t)return;const hist=(t.historico||[]).map(h=>`<div class="v3-step"><small>${esc(new Date(h.em).toLocaleString('pt-BR'))} · ${esc(h.autor||'Usuário')}</small><p>${esc(h.texto)}</p></div>`).join('');showModal(`<h2>${esc(t.titulo)}</h2><p>Responsável: ${esc(t.responsavel||'A definir')} · Prazo: ${esc(t.data)}</p><h3>Histórico</h3>${hist||'<p>Sem registros anteriores</p>'}<form onsubmit="claraSaveTaskHistory(event,'${safeId(id)}')"><label>Novo prazo<input class="v3-input" type="date" name="data" value="${esc(t.data)}" required></label><label>Motivo da mudança de prazo (obrigatório quando alterar)<textarea class="v3-input" name="motivo" rows="2" maxlength="2000"></textarea></label><label>Adicionar ao histórico<textarea class="v3-input" name="historico" rows="3" maxlength="3000"></textarea></label><button class="v3-btn">Salvar alterações</button></form>`)}
function claraSaveTaskHistory(e,id){e.preventDefault();const t=V3.claraTasks.find(x=>x.id===id);if(!t)return;const f=new FormData(e.target),data=String(f.get('data')),motivo=String(f.get('motivo')||'').trim(),obs=String(f.get('historico')||'').trim();if(data!==t.data&&!motivo){toast('Informe o motivo da alteração do prazo.');return}if(data===t.data&&!obs){toast('Informe uma atualização para o histórico.');return}const h=t.historico||(t.historico=[]),autor=CLARA_ACCESS?.perfil||'Usuário';if(data!==t.data){h.push({em:new Date().toISOString(),tipo:'prazo',autor,texto:'Prazo alterado de '+t.data+' para '+data+'. Motivo: '+motivo});t.data=data}if(obs)h.push({em:new Date().toISOString(),tipo:'observacao',autor,texto:obs});persistV3();closeModal();render()}
function claraSelectHistory(id,yes){const j=V3.claraHistory.find(j=>j.id===id);if(j){j.playbook=yes;persistV3()}}
function claraDownload(name,obj){const b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function claraMoment(){const tabs=pages.filter(p=>p!=='CONFIGURAÇÕES'&&claraCanView(p));showModal(`<h2>Gerar Meu Momento</h2><p>Selecione somente os dados necessários para a análise. Revise o arquivo antes de compartilhar.</p><form onsubmit="claraDownloadMoment(event)"><label>Destinatário<select name="destino" class="v3-input"><option value="clara">Clara</option><option value="consultoria">Consultoria</option></select></label>${tabs.map(p=>`<label style="display:block;padding:7px"><input type="checkbox" name="abas" value="${esc(p)}" checked> ${esc(p)}</label>`).join('')}<button class="v3-btn">Gerar arquivo JSON</button></form>`)}
function claraDownloadMoment(e){e.preventDefault();const f=new FormData(e.target),tabs=f.getAll('abas');if(!tabs.length){toast('Escolha ao menos uma aba.');return}const data={formato:'CLARA_MOMENTO',versao:'1.0',gerado_em:new Date().toISOString(),destinatario:f.get('destino'),empresa_nome:D.empresa.nome,abas_selecionadas:tabs,dados:{}};if(tabs.includes('ROTINAS'))data.dados.rotinas=V3.claraTasks;if(tabs.includes('DIÁRIO DE BORDO'))data.dados.diario=V3.claraHistory;if(tabs.includes('PROCESSOS'))data.dados.processos=E.processos.map(p=>({nome:p.nome,area:p.area,objetivo:p.objetivo}));if(tabs.includes('INDICADORES'))data.dados.indicadores=V3.indicators;if(tabs.includes('CRESCIMENTO'))data.dados.oportunidades=[...E.oportunidades,...pilot.suggestions].map(x=>({titulo:x.titulo,descricao:x.descricao}));if(tabs.includes('HOJE'))data.dados.hoje={atrasos:claraLateTasks(),prioridades:pilot.running};claraDownload('CLARA_MEU_MOMENTO.json',data);closeModal();toast('Arquivo preparado. Confira o conteúdo antes de compartilhar.')}
function claraOpenChat(){const u=window.parent?.CLARA_CONFIG?.claraChatUrl||window.parent?.CLARA_CHAT_URL||window.CLARA_CHAT_URL||'';if(u&&/^https:\/\/chatgpt\.com\//.test(u))window.open(u,'_blank','noopener,noreferrer');else{window.open('https://chatgpt.com/','_blank','noopener,noreferrer');toast('Configure o link exclusivo da Clara deste cliente para abrir o agente diretamente.')}}
function claraImportFile(){const el=document.createElement('input');el.type='file';el.accept='.json,application/json';el.hidden=true;el.setAttribute('aria-label','Arquivo JSON da Clara');el.onchange=async()=>{try{const file=el.files?.[0];if(!file)return;if(file.size>250000){toast('Arquivo excede 250 KB.');return}const data=JSON.parse(await file.text());claraPreviewImport(data)}catch(err){toast('Arquivo JSON inválido ou incompatível.')}finally{el.remove()}};el.addEventListener('cancel',()=>el.remove(),{once:true});document.body.appendChild(el);el.click()}
function claraPreviewImport(d){if(!d||d.formato!=='CLARA_ATUALIZACAO'||d.versao!=='1.0'||typeof d.id!=='string'||d.id.length>120||!Array.isArray(d.alteracoes)||!d.alteracoes.length||d.alteracoes.length>100){toast('Este não é um arquivo oficial CLARA_ATUALIZACAO v1.0.');return}if(V3.claraImports.includes(d.id)){toast('Este arquivo já foi importado.');return}if(d.empresa_nome!==D.empresa.nome){toast('Arquivo destinado a outra empresa.');return}const valid=d.alteracoes.every(a=>a&&['diario','rotinas'].includes(a.aba)&&['adicionar_registro','criar_tarefa'].includes(a.acao)&&typeof a.titulo==='string'&&a.titulo.length<=180&&typeof a.resumo==='string'&&a.resumo.length<=10000&&(a.aba!=='rotinas'||/^\d{4}-\d{2}-\d{2}$/.test(a.data||'')));if(!valid){toast('Arquivo contém ações não reconhecidas. Nenhuma mudança foi feita.');return}window.claraPendingImport=d;showModal(`<h2>Prévia de importação</h2><p><b>${esc(d.assunto||'Atualização da Clara')}</b> · ${d.alteracoes.length} alterações. Marque o que deseja aplicar.</p><form onsubmit="claraApplyImport(event)">${d.alteracoes.map((a,i)=>`<label style="display:block;border:1px solid #dce6ef;border-radius:12px;padding:13px;margin:9px 0"><input type="checkbox" name="change" value="${i}" checked> <b>${esc(a.aba)} · ${esc(a.titulo)}</b><p class="v3-muted">${esc(a.resumo)}</p>${a.data?`<small>Prazo: ${esc(a.data)}</small>`:''}</label>`).join('')}<button class="v3-btn">Confirmar alterações selecionadas</button></form>`)}
function claraApplyImport(e){e.preventDefault();const d=window.claraPendingImport;if(!d)return;const ids=new FormData(e.target).getAll('change').map(Number);if(!ids.length){toast('Nenhuma alteração selecionada.');return}for(const i of ids){const a=d.alteracoes[i];if(!a)continue;if(a.aba==='diario'){V3.claraHistory.unshift({id:'j'+d.id+'_'+i,data:d.data||new Date().toISOString().slice(0,10),assunto:a.titulo,resumo:a.resumo,pendencias:Array.isArray(a.pendencias)?a.pendencias.slice(0,20).map(String):[],origem:'Clara',playbook:false})}if(a.aba==='rotinas')V3.claraTasks.push({id:'t'+d.id+'_'+i,titulo:a.titulo,data:a.data,responsavel:String(a.responsavel||''),ok:false})}V3.claraImports.push(d.id);persistV3();closeModal();window.claraPendingImport=null;render();toast('Alterações selecionadas aplicadas em sincronização.')}
function claraPrintDocument(tipo){const today=new Date().toLocaleDateString('pt-BR');const company=esc(D.empresa.nome);let body='';if(tipo==='manual'){body=E.processos.map(p=>`<article><h2>${esc(p.nome)}</h2><p><b>Área:</b> ${esc(p.area||'')}</p><p>${esc(p.objetivo||'')}</p><ol>${processSteps(p).map(st=>`<li>${esc(st)}</li>`).join('')}</ol></article>`).join('')}else if(tipo==='momento'){body=`<h2>Rotinas</h2><p>${V3.claraTasks.length} compromissos · ${claraLateTasks().length} atrasados</p><h2>Diário de Bordo</h2><p>${V3.claraHistory.length} registros</p>`}else{body=V3.claraHistory.map(j=>`<article><h2>${esc(j.assunto)}</h2><p>${esc(j.data)}</p><p>${esc(j.resumo)}</p></article>`).join('')}const old=document.getElementById('v3-print');old?.remove();const el=document.createElement('div');el.id='v3-print';el.innerHTML=`<div class="v3-print"><h1>${esc(tipo==='manual'?'Manual Vivo':tipo==='momento'?'Meu Momento':'Histórico de Análises')}</h1><h2>${company}</h2><p>Data: ${today}</p><hr>${body}</div>`;document.body.appendChild(el);window.print();setTimeout(()=>el.remove(),2000)}
function claraExportPlaybook(){const list=V3.claraHistory.filter(j=>j.playbook);if(!list.length){toast('Selecione registros do Diário para o playbook.');return}const html=`<div class="v3-print"><h1>Playbook · Conversas e decisões</h1><h2>${esc(D.empresa.nome)}</h2><p>Gerado em ${new Date().toLocaleDateString('pt-BR')}</p><hr>${list.map(j=>`<article><h2>${esc(j.assunto)}</h2><p>${esc(j.data)} · Clara</p><p>${esc(j.resumo)}</p>${j.pendencias?.length?`<h3>Pendências</h3><ul>${j.pendencias.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</article>`).join('')}</div>`;document.getElementById('v3-print')?.remove();const el=document.createElement('div');el.id='v3-print';el.innerHTML=html;document.body.appendChild(el);window.print();setTimeout(()=>el.remove(),1500)}
function render(){baseRender();let root=document.getElementById('content');if(page==='HOJE'){const proposals=(V3.propostasProcessos||[]).filter(x=>x.status==='pendente');if(proposals.length)root.insertAdjacentHTML('afterbegin',`<div class="v3-card"><h2>Em foco · Propostas de processos para aprovação (${proposals.length})</h2>${proposals.map(p=>`<div class="item"><b>${esc(p.titulo||'Nova proposta')}</b><p>${esc(p.descricao||'')}</p><button class="v3-btn" onclick="claraReviewProposal('${safeId(p.id)}')">Revisar proposta</button></div>`).join('')}</div>`);const late=claraLateTasks();const lateHtml=`<section class="v3-card clara-late-card" aria-label="Alertas de rotina em atraso"><div class="flex" style="align-items:center;flex-wrap:wrap"><div><div class="eyebrow">ACOMPANHAMENTO DE PRAZOS</div><h2 style="margin:7px 0">Alertas de rotina em atraso</h2><p class="muted" style="margin:0">Compromissos vencidos que ainda não foram concluídos.</p></div><div class="clara-late-count ${late.length?'has-late':''}" aria-label="${late.length} rotinas em atraso">${late.length}</div></div>${late.length?`<div class="stack" style="margin-top:16px">${late.slice().sort((a,b)=>a.data.localeCompare(b.data)).map(t=>`<div class="item flex" style="flex-wrap:wrap"><div><b>${esc(t.titulo)}</b><p>Prazo: ${esc(new Date(t.data+'T12:00:00').toLocaleDateString('pt-BR'))} · Responsável: ${esc(t.responsavel||'Não definido')}</p></div><button class="btn light" onclick="go('ROTINAS');claraEditTask('${safeId(t.id)}')">Ver compromisso e histórico</button></div>`).join('')}</div>`:`<p class="hint" style="margin:15px 0 0">Nenhuma rotina em atraso neste momento.</p>`}</section>`;const greeting=root.querySelector('h1');const greetingSubtitle=greeting?.nextElementSibling;const anchor=greetingSubtitle?.matches('p')?greetingSubtitle:greeting;if(anchor)anchor.insertAdjacentHTML('afterend',lateHtml);else root.insertAdjacentHTML('afterbegin',lateHtml)}if(page==='PROCESSOS')root.innerHTML=v3Processes();if(page==='INDICADORES')root.innerHTML=v3Indicators();if(page==='ROTINAS')root.innerHTML=v3Rotinas();if(page==='DIÁRIO DE BORDO')root.innerHTML=v3Journal();if(page==='CONFIGURAÇÕES'){root.innerHTML=v3Settings();if(window.parent!==window)window.parent.postMessage({tipo:'CLARA_SETTINGS_READY'},location.origin)}}

function saveGoal(e,id){
 e.preventDefault();
 if(!canDecide()){toast('Somente proprietária ou gestora autorizada pode confirmar metas.');return}
 const f=new FormData(e.target),meta=Number(f.get('meta'));
 if(!Number.isFinite(meta)||meta<0||(id==='dependencia-proprietaria'&&meta>48)){toast('Informe uma meta válida.');return}
 const old=goalState.goals[id]||null;
 const entry={meta,prazo:String(f.get('prazo')||''),responsavel:String(f.get('responsavel')||''),justificativa:String(f.get('justificativa')||''),status:'Meta confirmada',atualizado_em:new Date().toISOString()};
 goalState.goals[id]=entry;goalState.history.unshift({id,anterior:old,novo:entry,at:new Date().toISOString(),por:pilot.role});
 saveGoalState();closeModal();render();toast('Meta salva em sincronização.');
}
